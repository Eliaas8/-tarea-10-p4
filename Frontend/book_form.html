<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        /* (Mismos estilos que index.html) */
        body { font-family: sans-serif; margin: 20px; }
        .flash { padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        form div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 15px; margin-right: 5px; text-decoration: none; border-radius: 3px; cursor: pointer; border: none; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div>
            <label for="title">Título:</label>
            <input type="text" id="title" name="title" value="{{ book.title or '' }}" required>
        </div>
        <div>
            <label for="author">Autor:</label>
            <input type="text" id="author" name="author" value="{{ book.author or '' }}" required>
        </div>
        <div>
            <label for="year">Año de Publicación:</label>
            <input type="number" id="year" name="year" value="{{ book.year or '' }}" required min="1000" max="2025">
        </div>
        <div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</body>
</html>
